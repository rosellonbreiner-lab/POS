version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mototaller_postgres
    restart: always
    environment:
      POSTGRES_USER: mototaller
      POSTGRES_PASSWORD: mototaller_secret_password
      POSTGRES_DB: mototaller
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mototaller -d mototaller"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

